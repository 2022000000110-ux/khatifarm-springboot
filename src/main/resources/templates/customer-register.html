<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Registration - KhatiFarm</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f3;
        }

        .container {
            width: 450px;
            max-width: 92%;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #2e7d32;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #256628;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #666;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        KhatiFarm
    </div>

    <div class="subtitle">
        Organic Marketplace
    </div>

    <h2>Create Customer Account</h2>

    <div th:if="${error}"
         class="error"
         th:text="${error}">
    </div>

    <form th:action="@{/customer/register}"
          th:object="${customer}"
          method="post">

        <label>Full Name</label>

        <input type="text"
               th:field="*{name}"
               placeholder="Enter your full name"
               required>


        <label>Email</label>

        <input type="email"
               th:field="*{email}"
               placeholder="Enter your email"
               required>


        <label>Phone Number</label>

        <input type="text"
               th:field="*{phone}"
               placeholder="01XXXXXXXXX"
               required>


        <label>Password</label>

        <input type="password"
               th:field="*{password}"
               placeholder="Create a password"
               required>


        <label>Address</label>

        <input type="text"
               th:field="*{address}"
               placeholder="Enter your delivery address"
               required>


        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a th:href="@{/customer/login}">
            Login
        </a>

    </div>

    <div class="home">

        <a th:href="@{/}">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
