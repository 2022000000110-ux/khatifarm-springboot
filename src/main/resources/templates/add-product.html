<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product | KhatiFarm</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .form-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .form-container h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1b5e20;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar">

    <div class="logo">
        🌱 KhatiFarm
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/products">
            Products
        </a>

        <a href="/products/add">
            Add Product
        </a>

    </div>

</nav>


<!-- Add Product Form -->

<div class="form-container">

    <h1>🌱 Add New Product</h1>

    <form th:action="@{/products/save}"
          th:object="${product}"
          method="post">


        <!-- Product Name -->

        <div class="form-group">

            <label>
                Product Name
            </label>

            <input
                    type="text"
                    th:field="*{name}"
                    placeholder="Example: Sundarban Honey"
                    required>

        </div>


        <!-- Category -->

        <div class="form-group">

            <label>
                Category
            </label>

            <select th:field="*{category}" required>

                <option value="">
                    Select Category
                </option>

                <option value="Honey">
                    Honey
                </option>

                <option value="Mango">
                    Mango
                </option>

                <option value="Vegetables">
                    Vegetables
                </option>

                <option value="Oil">
                    Oil
                </option>

                <option value="Gur">
                    Gur
                </option>

                <option value="Dry Food">
                    Dry Food
                </option>

            </select>

        </div>


        <!-- Seller -->

        <div class="form-group">

            <label>
                Seller Name
            </label>

            <input
                    type="text"
                    th:field="*{sellerName}"
                    placeholder="Example: Rahim Agro"
                    required>

        </div>


        <!-- Origin -->

        <div class="form-group">

            <label>
                Origin / Location
            </label>

            <input
                    type="text"
                    th:field="*{origin}"
                    placeholder="Example: Satkhira"
                    required>

        </div>

        <!-- Product Image -->

        <div class="form-group">

            <label>
                Product Image
            </label>

            <input
                    type="text"
                    th:field="*{imageUrl}"
                    placeholder="Example: /images/sundarban-honey.jpg"
                    required>

        </div>
        <!-- Price -->

        <div class="form-group">

            <label>
                Price (BDT)
            </label>

            <input
                    type="number"
                    step="0.01"
                    th:field="*{price}"
                    placeholder="950"
                    required>

        </div>


        <!-- Stock -->

        <div class="form-group">

            <label>
                Stock
            </label>

            <input
                    type="number"
                    th:field="*{stock}"
                    placeholder="50"
                    required>

        </div>


        <!-- Quality Score -->

        <div class="form-group">

            <label>
                Quality Score (0-100)
            </label>

            <input
                    type="number"
                    min="0"
                    max="100"
                    th:field="*{qualityScore}"
                    placeholder="92"
                    required>

        </div>


        <!-- Grade -->

        <div class="form-group">

            <label>
                Quality Grade
            </label>

            <select th:field="*{grade}" required>

                <option value="">
                    Select Grade
                </option>

                <option value="A+">
                    A+ - Premium Quality
                </option>

                <option value="A">
                    A - High Quality
                </option>

                <option value="B">
                    B - Standard Quality
                </option>

            </select>

        </div>

        <label>
            Product Source
        </label>

        <select name="sellerType" required>

            <option value="KHATIFARM">
                KhatiFarm
            </option>

            <option value="SELLER">
                Other Seller
            </option>

        </select>

        <!-- Status -->

        <div class="form-group">

            <label>
                Product Status
            </label>

            <select th:field="*{status}" required>

                <option value="PENDING">
                    Pending
                </option>

                <option value="APPROVED">
                    Approved
                </option>

                <option value="REJECTED">
                    Rejected
                </option>

            </select>

        </div>


        <!-- Submit -->

        <button
                type="submit"
                class="submit-btn">

            Add Product

        </button>

    </form>


    <a href="/products"
       class="back-link">

        ← View All Products

    </a>

</div>


</body>

</html>
