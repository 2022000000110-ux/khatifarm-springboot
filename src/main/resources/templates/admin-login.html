<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | KhatiFarm</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .login-container {
            max-width: 450px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1b5e20;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .admin-note {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            text-align: center;
            color: #666;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌱 KhatiFarm
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/seller/login">
            Seller Login
        </a>

    </div>

</nav>


<div class="login-container">

    <h1>
        🔐 Admin Login
    </h1>


    <div class="error-message"
         th:if="${error}"
         th:text="${error}">
    </div>


    <form action="/admin/login"
          method="post">

        <div class="form-group">

            <label>
                Username
            </label>

            <input type="text"
                   name="username"
                   placeholder="Enter admin username"
                   required>

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input type="password"
                   name="password"
                   placeholder="Enter admin password"
                   required>

        </div>


        <button type="submit"
                class="login-btn">

            Login as Admin

        </button>

    </form>


    <div class="admin-note">

        Admin access is restricted to authorized users.

    </div>

</div>

</body>

</html>
